name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.12', 24]   # 20.12 is the minimum: the .tdrp tests need CompressionStream("deflate-raw")
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Build, engine, container, examples and privacy tests
        run: npm test
      - name: Committed build is up to date
        run: git diff --exit-code -- dist/ || { echo "::error::dist/ differs from a fresh build; run npm run build and commit dist/"; exit 1; }

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build and drive the page
        run: npm run build && python test/ui_smoke.py

  validation:
    name: Validation against scikit-rf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install scikit-rf and friends
        run: pip install -r validation/requirements.txt
      - name: Run every pass/fail check
        run: MPLBACKEND=Agg python validation/run_validation.py
